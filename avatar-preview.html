<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body, canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; }
  </style>
  <script src="https://cdn.keepwork.com/digitalhuman/live2d/pixi-7.4.3.min.js"></script>
  <script src="https://cdn.keepwork.com/digitalhuman/live2d/live2dcubismcore.min.js"></script>
  <script src="https://cdn.keepwork.com/digitalhuman/live2d/cubism4-lipsyncpatch-0.5.0-ls-8.min.js"></script>
</head>
<body>
  <canvas id="previewCanvas"></canvas>
  <script>
    const LIVE2D_BASE = 'https://cdn.keepwork.com/digitalhuman/live2d/assets/';
    const canvas = document.querySelector('#previewCanvas');
    const app = new PIXI.Application({ view: canvas, autoStart: true, backgroundAlpha: 0, antialias: true });
    let model = null;
    let requestId = 0;
    let modelScale = 1;

    addEventListener('pointermove', (event) => {
      const focus = model?.internalModel?.focusController;
      if (!focus) return;
      const x = event.clientX / Math.max(1, innerWidth) * 2 - 1;
      const y = 1 - event.clientY / Math.max(1, innerHeight) * 2;
      focus.focus(x, y);
    }, { capture: true });

    function resize() {
      if (!model) return;
      const width = Math.max(1, canvas.clientWidth);
      const height = Math.max(1, canvas.clientHeight);
      app.renderer.resize(Math.round(width), Math.round(height));
      const bounds = model.getLocalBounds();
      const scale = Math.min((width * 0.96) / bounds.width, (height * 0.98) / bounds.height) * modelScale;
      model.scale.set(scale);
      model.x = width / 2 - (bounds.x + bounds.width / 2) * scale;
      model.y = modelScale > 1
        ? height / 2 - (bounds.y + bounds.height / 2) * scale
        : height - 4 - (bounds.y + bounds.height) * scale;
    }

    addEventListener('resize', resize);
    addEventListener('message', async (event) => {
      if (event.source !== parent || event.data?.type !== 'preview-avatar') return;
      const currentRequest = ++requestId;
      modelScale = Number(event.data.scale) > 0 ? Number(event.data.scale) : 1;
      try {
        const nextModel = await PIXI.live2d.Live2DModel.from(`${LIVE2D_BASE}${event.data.model}`, { autoFocus: true, autoHitTest: false });
        if (currentRequest !== requestId) return;
        if (model) app.stage.removeChild(model);
        model = nextModel;
        model.removeAllListeners('globalpointermove');
        app.stage.addChild(model);
        resize();
        parent.postMessage({ type: 'avatar-preview-ready', id: event.data.id }, '*');
      } catch {
        parent.postMessage({ type: 'avatar-preview-error', id: event.data.id }, '*');
      }
    });
    parent.postMessage({ type: 'avatar-preview-frame-ready' }, '*');
  </script>
</body>
</html>
